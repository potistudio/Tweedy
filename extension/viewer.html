<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Tweet Vault</title>
		<link rel="icon" href="icons/icon32.png">
		<link rel="stylesheet" href="src/viewer.css">
	</head>
	<body>
		<div class="app">
			<aside class="side" id="side">
				<div class="brand">
					<img src="icons/icon48.png" alt="" width="28" height="28">
					<span>Tweet Vault</span>
				</div>

				<nav class="nav">
					<div class="nav-label">フォルダ</div>
					<ul class="nav-list" id="folderList"></ul>
					<form class="new-folder" id="newFolderForm">
						<input id="newFolderName" placeholder="＋ 新しいフォルダ" maxlength="60" autocomplete="off">
					</form>

					<div class="nav-label">タグ</div>
					<ul class="nav-list tags" id="tagList"></ul>
				</nav>

				<div class="side-foot">
					<div class="usage" id="usage"></div>
					<button class="link-btn" id="openSettings" type="button">設定・バックアップ</button>
				</div>
			</aside>

			<main class="main">
				<header class="toolbar">
					<button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="メニュー">☰</button>
					<div class="search">
						<input type="search" id="q" placeholder="本文・ユーザー・タグで検索" autocomplete="off">
					</div>
					<select id="sort" aria-label="並び順">
						<option value="saved-desc">保存日が新しい順</option>
						<option value="saved-asc">保存日が古い順</option>
						<option value="created-desc">投稿日が新しい順</option>
						<option value="created-asc">投稿日が古い順</option>
					</select>
					<div class="seg" role="group" aria-label="表示形式">
						<button type="button" data-layout="grid" aria-label="グリッド表示">▦</button>
						<button type="button" data-layout="list" aria-label="リスト表示">☰</button>
					</div>
				</header>

				<div class="banner" id="banner" hidden>
					新しく保存されたツイートがあります
					<button type="button" id="bannerReload">更新</button>
				</div>

				<div class="summary">
					<h1 id="viewTitle">すべて</h1>
					<span id="viewCount"></span>
					<div class="active-filters" id="activeFilters"></div>
				</div>

				<div class="grid" id="grid"></div>
				<div id="sentinel" aria-hidden="true"></div>
				<div class="empty" id="empty" hidden></div>
			</main>
		</div>

		<datalist id="tagSuggestions"></datalist>

		<dialog id="settings">
			<form method="dialog" class="dlg">
				<h2>設定・バックアップ</h2>
				<label class="check"> <input type="checkbox" id="hideNative"> X 標準のブックマークボタンを隠す </label>
				<section>
					<h3>エクスポート</h3>
					<p class="note">
						拡張機能をアンインストールすると保存データも削除されます。定期的なバックアップを推奨します。
					</p>
					<div class="row">
						<button type="button" id="exportFull">メディア込みで書き出す</button>
						<button type="button" id="exportMeta">メタデータのみ書き出す</button>
					</div>
				</section>
				<section>
					<h3>インポート</h3>
					<p class="note">書き出した .jsonl ファイルを読み込みます。同じ ID のツイートは上書きされます。</p>
					<div class="row">
						<input type="file" id="importFile" accept=".jsonl,application/x-ndjson">
					</div>
				</section>
				<p class="progress" id="ioProgress" role="status"></p>
				<div class="row end">
					<button value="close">閉じる</button>
				</div>
			</form>
		</dialog>

		<div class="lightbox" id="lightbox" hidden>
			<button type="button" class="lb-close" data-lb="close" aria-label="閉じる">✕</button>
			<button
				type="button"
				class="lb-download"
				id="lbDownload"
				hidden
				data-lb="download"
				aria-label="この画像をダウンロード"
			>
				<svg viewBox="0 0 24 24" aria-hidden="true">
					<path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19h14" />
				</svg>
			</button>
			<button type="button" class="lb-nav prev" data-lb="prev" aria-label="前の画像">‹</button>
			<img id="lbImg" alt="">
			<button type="button" class="lb-nav next" data-lb="next" aria-label="次の画像">›</button>
		</div>

		<script type="module" src="src/viewer.js"></script>
	</body>
</html>
